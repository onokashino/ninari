name: Ошибка
description: Что-то работает не так
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Проще всего начать из приложения: «Настройки → Приложение → Сообщить о проблеме» сам впишет версию, систему и лог."
  - type: textarea
    id: what
    attributes:
      label: Что случилось
      description: И что ожидалось вместо этого
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить
      placeholder: |
        1. Открыть тайтл ...
        2. Нажать ...
  - type: input
    id: version
    attributes:
      label: Версия
      description: Настройки → Приложение
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Система
      placeholder: Arch Linux · wayland · KDE
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Лог
      description: Конец файла ninari.log; из приложения подставляется сам
      render: text
