# ninari player defaults. The app passes --config-dir here, so the user's own mpv config is untouched.
vo=gpu-next
hwdec=auto-safe
keep-open=no
save-position-on-quit=no
# the app draws all controls on top of the video
osc=no
osd-bar=no
cache=yes
demuxer-max-bytes=128MiB
# what was already watched, for seeking back without a reload; mpv keeps 50 MiB by default
demuxer-max-back-bytes=32MiB
demuxer-readahead-secs=60
screenshot-directory=~~desktop/
# Streamed anime is 8-bit: skies and shadows show steps. Debanding smooths them, nearly free.
deband=yes
deband-iterations=2
deband-threshold=32
deband-range=16
deband-grain=0
# The best of mpv's own scalers, where no shader upscales (and for the picture's last step).
scale=ewa_lanczossharp
dscale=mitchell
cscale=ewa_lanczossharp
