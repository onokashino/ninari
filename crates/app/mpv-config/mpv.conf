# ninari player defaults. The app passes --config-dir here, so the user's own mpv config is untouched.
vo=gpu-next
hwdec=auto-safe
keep-open=no
save-position-on-quit=no
# the app draws all controls on top of the video
osc=no
osd-bar=no
cache=yes
demuxer-max-bytes=256MiB
demuxer-readahead-secs=60
screenshot-directory=~~desktop/
